[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-text-coordinates"
version = "1.0.0"
description = "Task-text coordinates for normalized few-shot vision-language adaptation"
requires-python = ">=3.10,<3.14"
dependencies = ["torch==2.7.1", "numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
encoders = [
  "torchvision==0.22.1",
  "transformers==5.16.1",
  "sentencepiece>=0.2",
  "ftfy>=6",
  "regex",
  "tqdm",
  "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6"
]
test = ["pytest>=8"]

[project.scripts]
tasktext = "tasktext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
